name: Sync changelog

# Regenerates changelog/index.html and the changelog regions of index.html from
# the npm registry + the core repo's CHANGELOG.md, then opens (or updates) a PR
# if the output actually changed.
#
# main is protected by an org-level ruleset — "changes must be made through a
# pull request" — so this workflow cannot push to it directly. It pushes the
# generated diff to a bot-owned branch and raises a PR for a human to approve.
on:
  schedule:
    # 12:00 UTC daily — catches any publish within a day even with no dispatch.
    - cron: '0 12 * * *'
  workflow_dispatch:
  # Fired by the n-dx release pipeline for a near-instant update. See below.
  repository_dispatch:
    types: [ndx-release]

permissions:
  contents: write
  pull-requests: write

# Never let two syncs race on the same branch.
concurrency:
  group: sync-changelog
  cancel-in-progress: false

env:
  SYNC_BRANCH: changelog-sync

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the sync branch below can be re-cut from the tip of
          # the target branch; the default shallow clone cannot.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Regenerate changelog
        run: node scripts/sync-changelog.mjs

      - name: Open or update the sync PR
        id: commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if git diff --quiet -- index.html changelog/; then
            echo "no changes"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          version=$(node -e "const s=require('fs').readFileSync('index.html','utf8');console.log(s.match(/hero-version-num\">v([^<]+)</)[1])")
          title="Sync changelog for @n-dx/core v${version}"

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Re-cut the sync branch from the tip of the target branch every run so
          # the PR only ever carries the current generated diff — never a stack of
          # stale commits from previous syncs.
          git checkout -B "$SYNC_BRANCH"
          git add index.html changelog/
          git commit -m "$title"
          git push --force origin "$SYNC_BRANCH"

          echo "changed=true" >> "$GITHUB_OUTPUT"

          pr=$(gh pr list --head "$SYNC_BRANCH" --base "$GITHUB_REF_NAME" \
                 --state open --json number -q '.[0].number // empty')

          if [ -n "$pr" ]; then
            # The force-push already refreshed the diff; just keep the title in
            # step with the version it now carries.
            gh pr edit "$pr" --title "$title"
            url=$(gh pr view "$pr" --json url -q .url)
            echo "Updated existing PR: $url"
          else
            compare="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${GITHUB_REF_NAME}...${SYNC_BRANCH}?expand=1"
            if ! url=$(gh pr create \
                  --base "$GITHUB_REF_NAME" --head "$SYNC_BRANCH" \
                  --title "$title" \
                  --body "Generated by \`scripts/sync-changelog.mjs\` from the npm registry and the core repo's CHANGELOG.md. Review and merge to publish; merging to \`${GITHUB_REF_NAME}\` triggers the Pages build."); then
              echo "::error::Could not open the PR. The branch is pushed — open it by hand: $compare"
              echo "Could not open the PR automatically. [Open it by hand]($compare)" >> "$GITHUB_STEP_SUMMARY"
              echo "If this keeps happening, enable \"Allow GitHub Actions to create and approve pull requests\" in the org's Actions settings." >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            echo "Opened PR: $url"
          fi

          echo "[$title]($url)" >> "$GITHUB_STEP_SUMMARY"

# ── Instant updates on publish (optional) ─────────────────────────────────────
#
# The schedule above means the site trails a publish by up to a day. To have it
# update within seconds, add a step to the release job in
# en-dash-consulting/n-dx that pokes this workflow:
#
#   - name: Refresh n-dx.dev changelog
#     run: |
#       gh api --method POST repos/en-dash-consulting/n-dx-dot-dev/dispatches \
#         -f event_type=ndx-release
#     env:
#       GH_TOKEN: ${{ secrets.NDX_DEV_DISPATCH_TOKEN }}
#
# GITHUB_TOKEN cannot dispatch across repositories, so NDX_DEV_DISPATCH_TOKEN
# must be a PAT (or GitHub App token) with `contents: write` on this repo.
